# Mantém o banco (Supabase, plano grátis) ativo.
# O plano grátis pausa o projeto depois de 7 dias sem uso, e aí o app não abre.
# Esta rotina faz uma consulta leve ao banco todo dia, então ele nunca fica 7 dias parado.
# Se a consulta falhar (por exemplo, o banco já pausou), a execução fica vermelha
# e o GitHub manda um e-mail avisando.
name: Manter banco ativo

on:
  schedule:
    - cron: "0 12 * * *" # todo dia às 12:00 UTC (09:00 em Brasília)
  workflow_dispatch: {} # permite rodar na mão pela aba Actions
  push: # TEMPORÁRIO: só para testar antes do merge
    branches: [claude/project-thread-rf70kt]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: https://pnjrfqwjlkexupdiezuo.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta o segredo SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Consulta pequena que passa pelo banco de dados (não altera nada).
          status=$(curl -sS -o resposta.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/salarios_minimos?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta HTTP: $status"
          if [ "$status" != "200" ]; then
            echo "::error::O banco não respondeu (HTTP $status). Ele pode estar pausado: abra o painel do Supabase e clique em Restore."
            head -c 500 resposta.txt
            exit 1
          fi
          echo "Banco ativo."
